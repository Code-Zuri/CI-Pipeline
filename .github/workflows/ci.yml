name: Actividad 10 - CI Pipeline

on:
  push:
    branches:
      - main
      - actividad-10-mejora-ci

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas y calidad del codigo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, fileinfo
          tools: composer:v2
          coverage: none

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validar Composer
        run: composer validate --strict

      - name: Instalar dependencias PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Preparar entorno Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Validar estilo PHP
        run: composer lint:check

      - name: Analisis estatico PHP
        run: composer types:check

      - name: Validar frontend
        run: npm run check

      - name: Validar TypeScript
        run: npm run types:check

      - name: Compilar frontend
        run: npm run build

      - name: Ejecutar pruebas automatizadas
        run: |
          mkdir -p test-results
          php artisan test --log-junit=test-results/junit.xml

      - name: Guardar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: test-results/
          if-no-files-found: warn
          retention-days: 30